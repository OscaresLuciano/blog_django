{% extends 'posts/base.html' %}

{% block title %}Registrarse · Blog de Luciano{% endblock %}

{% block content %}
<section class="tarjeta">
  <h1>Crear cuenta</h1>

  <form method="post" class="formulario">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="boton">Registrarme</button>
  </form>

  <p>¿Ya tenés cuenta? <a href="{% url 'login' %}">Iniciá sesión</a></p>
</section>
{% endblock %}
