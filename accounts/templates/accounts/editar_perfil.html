{% extends 'posts/base.html' %}

{% block title %}Editar perfil · Blog de Luciano{% endblock %}

{% block content %}
<section class="tarjeta">
  <h1>Editar perfil</h1>

  <form method="post" enctype="multipart/form-data" class="formulario">
    {% csrf_token %}
    {{ usuario_form.as_p }}
    {{ perfil_form.as_p }}
    <div class="acciones">
      <button type="submit" class="boton">Guardar cambios</button>
      <a class="boton boton-secundario" href="{% url 'perfil' %}">Cancelar</a>
    </div>
  </form>
</section>
{% endblock %}
