{% extends 'posts/base.html' %}

{% block title %}Cambiar contraseña · Blog de Luciano{% endblock %}

{% block content %}
<section class="tarjeta">
  <h1>Cambiar contraseña</h1>

  <form method="post" class="formulario">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="acciones">
      <button type="submit" class="boton">Cambiar contraseña</button>
      <a class="boton boton-secundario" href="{% url 'perfil' %}">Cancelar</a>
    </div>
  </form>
</section>
{% endblock %}
